<!DOCTYPE html>
<html lang="en">
<head>
    <script>
		const currentParams = window.location.search;
		if (localStorage.getItem('chatter_gate_cleared') !== 'true') {
			window.location.replace('/' + currentParams);
		}
	</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Chatter - Account Identity Access</title>
	<link rel="icon" type="image/png" href="/chatter-icon2.jpeg">
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div id="app-loading-screen" class="hidden">
		<div class="spinner-container">
			<div class="loading-spinner"></div>
			<p class="loading-text">Loading Chatter Application Infrastructure...</p>
		</div>
	</div>

    <div class="app-shell" style="max-width: 460px; margin: 60px auto; padding: 0 16px;">
        <header class="app-header" style="justify-content: center; margin-bottom: 24px;">
            <h1>Chatter</h1>
        </header>

        <main>
            <section id="auth-screen" class="card">
                <div class="tabs">
                    <button id="tab-login" class="tab active">Login</button>
                    <button id="tab-register" class="tab">Register</button>
                </div>
                <form id="login-form" class="auth-form active">
                    <label>Username</label>
                    <input id="login-username" type="text" autocomplete="username" />
                    <label>Password</label>
                    <input id="login-password" type="password" autocomplete="current-password" />
                    <button id="login-button" type="button" class="primary-button">Login</button>
					<p style="text-align: center; margin-top: 14px;">
						<a href="#" id="link-goto-forgot" style="font-size: 13px; color: var(--primary);">Forgot Password?</a>
					</p>
				</form>
				<form id="forgot-password-form" class="auth-form hidden" onsubmit="return false;">
					<h3>Recover Your Account</h3>
					<label>Account Username</label>
					<input id="forgot-username" type="text" placeholder="Enter username" />
					<button id="forgot-submit-button" type="button" class="primary-button">Send Reset Link</button>
					<button id="forgot-back-button" type="button" class="secondary-button" style="margin-top: 8px;">Back to Login</button>
				</form>
                <form id="register-form" class="auth-form" onsubmit="return false;">
					<div class="form-group">
						<input type="text" id="register-username" placeholder="Choose Username">
					</div>
					<div class="form-group">
						<input type="password" id="register-password" placeholder="Choose Password">
					</div>
					<div class="form-group">
						<input type="email" id="register-email" placeholder="Recovery Email (Optional)" />
					</div>
					<button id="register-button" class="btn btn-primary">Create Account</button>
				</form>
                <div id="auth-status" class="status"></div>
            </section>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // Inject a localized, isolated lightweight routing controller inside auth.html 
        // to handle validation queries without shifting token stores.
        const SERVER_URL = window.location.origin;
        const socket = io(SERVER_URL, { transports: ['websocket'] });
        const TOKEN_KEY = 'chatter_session_token';

        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const forgotPasswordForm = document.getElementById('forgot-password-form');
        const authStatus = document.getElementById('auth-status');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');

        function setAuthStatus(msg, type='info') {
            authStatus.textContent = msg;
            authStatus.className = `status ${type}`;
        }

        document.getElementById('link-goto-forgot').addEventListener('click', (e) => {
            e.preventDefault();
            // Remove active states from login/register
            loginForm.classList.remove('active');
            registerForm.classList.remove('active');
            
            // Force the forgot password form to show
            forgotPasswordForm.classList.remove('hidden');
            forgotPasswordForm.classList.add('active');
            forgotPasswordForm.style.display = 'block'; // Failsafe override
            
            setAuthStatus('');
        });

        document.getElementById('forgot-back-button').addEventListener('click', () => {
            // Hide the forgot password form
            forgotPasswordForm.classList.remove('active');
            forgotPasswordForm.classList.add('hidden');
            forgotPasswordForm.style.display = 'none'; // Failsafe override
            
            // Restore the login form
            loginForm.classList.add('active');
            loginForm.classList.remove('hidden');
            
            // Restore the tab highlights
            tabLogin.classList.add('active'); 
            tabRegister.classList.remove('active');
            
            setAuthStatus('');
        });

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active'); tabRegister.classList.remove('active');
            loginForm.classList.add('active'); registerForm.classList.remove('active');
            setAuthStatus('');
        });
        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active'); tabLogin.classList.remove('active');
            registerForm.classList.add('active'); loginForm.classList.remove('active');
            setAuthStatus('');
        });

        document.getElementById('login-button').addEventListener('click', () => {
            socket.emit('login', { 
                username: document.getElementById('login-username').value.trim(), 
                password: document.getElementById('login-password').value.trim() 
            });
        });

        document.getElementById('register-button').addEventListener('click', () => {
            socket.emit('user_exists', {
                username: document.getElementById('register-username').value.trim(),
                password: document.getElementById('register-password').value.trim(),
                email: document.getElementById('register-email').value.trim()
            });
        });

        document.getElementById('forgot-submit-button').addEventListener('click', async () => {
            const user = document.getElementById('forgot-username').value.trim();
            if(!user) { setAuthStatus('Please specify your username.', 'error'); return; }
            setAuthStatus('Checking account metrics status...', 'info');
            const res = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user })
            });
            const out = await res.json();
            setAuthStatus(out.message, res.ok && out.success ? 'success' : 'error');
        });

        socket.on('user_exists_response', (data) => {
            if (data.exists) { setAuthStatus('Username already exists.', 'error'); }
            else {
                socket.emit('create_user', {
                    username: document.getElementById('register-username').value.trim(),
                    password: document.getElementById('register-password').value.trim(),
                    email: document.getElementById('register-email').value.trim()
                });
            }
        });

        socket.on('login_successful', (d) => { localStorage.setItem(TOKEN_KEY, d.session_token); window.location.replace('/chat.html'); });
        socket.on('user_created', (d) => { if(d.success) { localStorage.setItem(TOKEN_KEY, d.session_token); window.location.replace('/chat.html'); } });
        socket.on('login_failed', (d) => setAuthStatus(d.message, 'error'));
        
        // Auto-login persistence check
        if (localStorage.getItem(TOKEN_KEY)) { window.location.replace('/chat.html'); }
    </script>
</body>
</html>
