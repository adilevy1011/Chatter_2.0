<!DOCTYPE html>
<html lang="en">
<head>
    <script>
		const hasClearedGate = localStorage.getItem('chatter_gate_cleared') === 'true';
		const hasLoginToken = localStorage.getItem('chatter_session_token');
		const currentParams = window.location.search;

		// ONLY redirect automatically if they have BOTH cleared the gate AND have a token session,
		// otherwise let them clear the gate challenge first.
		if (hasClearedGate && hasLoginToken) {
			window.location.replace('/chat.html' + currentParams);
		} else if (hasClearedGate) {
			window.location.replace('/auth.html' + currentParams);
		}
	</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chatter - Verification Required</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f3f6fb; }
        .gate-card { text-align: center; max-width: 400px; width: 100%; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .captcha-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; margin: 20px 0; display: flex; align-items: center; justify-content: space-between; }
        .checkbox-container { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 500; }
        .checkbox-container input { width: 20px; height: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="gate-card">
        <h2>Security Check</h2>
        <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">Please complete the security challenge below to access Chatter services.</p>
        
        <div class="captcha-box">
            <label class="checkbox-container">
                <input type="checkbox" id="security-gate-checkbox" />
                <span>I am not a robot</span>
            </label>
            <div style="font-size: 11px; color: var(--muted); text-align: right; line-height: 1.2;">
                Protected by<br><strong style="color: var(--primary);">Chatter Shield</strong>
            </div>
        </div>
        <div id="gate-status" class="status"></div>
    </div>

    <script>
        document.getElementById('security-gate-checkbox').addEventListener('change', async (e) => {
            if (e.target.checked) {
                const status = document.getElementById('gate-status');
                status.textContent = "Verifying browser integrity metrics...";
                status.className = "status info";
                
                // Keep target query parameters accessible for the redirect string
                const currentParams = window.location.search;
                
                setTimeout(() => {
                    // Update from volatile sessionStorage to persistent localStorage
                    localStorage.setItem('chatter_gate_cleared', 'true');
                    window.location.replace('/auth.html' + currentParams);
                }, 1200);
            }
        });
    </script>
</body>
</html>
