<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatter - Choose New Password</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="app-shell" style="justify-content: center; align-items: center; min-height: 100vh;">
        <section class="card" style="width: 100%; max-width: 400px; padding: 24px;">
            <h2>Choose New Password</h2>
            <form id="reset-form" onsubmit="return false;">
                <label for="new-password">New Secure Password</label>
                <input type="password" id="new-password" placeholder="Minimum 6 characters" required />
                <button id="reset-submit" class="primary-button" style="margin-top: 16px;">Update Password</button>
            </form>
            <div id="reset-status" class="status hidden" style="margin-top: 12px;"></div>
        </section>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const statusEl = document.getElementById('reset-status');

        if (!token) {
            statusEl.textContent = "Error: Invalid or missing authentication token context.";
            statusEl.className = "status error";
            statusEl.classList.remove('hidden');
            document.getElementById('reset-submit').disabled = true;
        }

        document.getElementById('reset-submit').addEventListener('click', async () => {
            const password = document.getElementById('new-password').value.trim();
            if (!password) return;

            statusEl.textContent = "Updating password across databases...";
            statusEl.className = "status info";
            statusEl.classList.remove('hidden');

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: password })
                });
                const result = await response.json();

                statusEl.textContent = result.message;
                if (response.ok && result.success) {
                    statusEl.className = "status success";
                    setTimeout(() => { window.location.href = "/"; }, 2500);
                } else {
                    statusEl.className = "status error";
                }
            } catch (err) {
                statusEl.textContent = "Network transaction failure.";
                statusEl.className = "status error";
            }
        });
    </script>
</body>
</html>
